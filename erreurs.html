<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes erreurs – CTIE QCM</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #d7dde8;border-radius:10px;background:#fff;color:#18212f;text-decoration:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.section{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 18px #0001}.stat b{font-size:25px;display:block}.section{margin:16px 0}.error{border-top:1px solid #eef1f5;padding:14px 0}.bad{color:#991b1b}.good{color:#166534}.explanation{background:#f8fafc;padding:10px;border-radius:9px;margin-top:8px}.muted{color:#667085}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="top"><div><h1>Mes erreurs</h1><div class="muted">Erreurs enregistrées pendant les entraînements.</div></div><a class="btn" href="./">Retour aux QCM</a></div><div id="summary" class="summary"></div><div id="content"></div></div><script>const KEY='ctieHistoryV1',N={MARCHES:'Marchés publics',GDPR:'GDPR / RGPD',LOI_CTIE:'Loi du CTIE',TOGAF:'TOGAF'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];try{JSON.parse(localStorage.getItem(KEY)||'[]').forEach(s=>(s.errors||[]).forEach(e=>all.push({...e,date:s.date})))}catch{}summary.innerHTML=Object.entries(N).map(([s,n])=>'<div class="stat"><span>'+n+'</span><b>'+all.filter(e=>e.subject===s).length+'</b><small>erreur(s)</small></div>').join('');content.innerHTML=Object.entries(N).map(([s,n])=>{const a=all.filter(e=>e.subject===s);return '<section class="section"><h2>'+n+' — '+a.length+'</h2>'+(a.length?a.map(e=>'<article class="error"><div class="muted">'+new Date(e.date).toLocaleString('fr-FR')+'</div><h3>'+esc(e.question)+'</h3><div class="bad"><b>Ta réponse :</b> '+esc(e.selected||'Sans réponse')+'</div><div class="good"><b>Bonne réponse :</b> '+esc(e.correct)+'</div><div class="explanation"><b>Explication :</b> '+esc(e.explanation||'')+'</div></article>').join(''):'<div class="muted">Aucune erreur enregistrée.</div>')+'</section>'}).join('');</script></body></html>
