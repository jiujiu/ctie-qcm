<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTIE – Progression</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #d6dce6;border-radius:10px;background:#fff;cursor:pointer}.primary{background:#111827;color:#fff}.cards,.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.item{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 22px #0001}.big{font-size:28px;font-weight:750}.muted{color:#667085}.cloud{padding:7px 10px;border-radius:9px;background:#eef2ff;font-size:13px;display:inline-block}.history{display:grid;gap:10px}@media(max-width:700px){.wrap{padding:10px}.cards,.subjects{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Ma progression CTIE</h1><div id="cloud" class="cloud">Chargement…</div></div><button class="btn primary" onclick="location.href='./'">Retour au quiz</button></div><div class="cards"><div class="card"><div class="muted">Tests</div><div id="tests" class="big">0</div></div><div class="card"><div class="muted">Moyenne</div><div id="avg" class="big">–</div></div><div class="card"><div class="muted">Meilleur</div><div id="best" class="big">–</div></div><div class="card"><div class="muted">Erreurs</div><div id="errs" class="big">0</div></div></div><h2>Par matière</h2><div id="subjects" class="subjects"></div><h2>Historique</h2><div id="history" class="history"></div></div>
<script>
const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(U,K),N={MARCHES:'Marchés publics',GDPR:'GDPR / RGPD',LOI_CTIE:'Loi du CTIE',TOGAF:'TOGAF'};
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');cloud.textContent='Cloud sécurisé : '+user.email;const [{data:h,error},{count:ec}]=await Promise.all([sb.from('quiz_results').select('*').order('created_at'),sb.from('quiz_errors').select('*',{count:'exact',head:true})]);if(error){cloud.textContent='Accès refusé';return}render(h||[],ec||0)}
function render(h,errorCount){tests.textContent=h.length;const p=h.map(x=>+x.percent||0);avg.textContent=h.length?Math.round(p.reduce((a,b)=>a+b,0)/h.length)+'%':'–';best.textContent=h.length?Math.max(...p)+'%':'–';errs.textContent=errorCount;subjects.innerHTML=Object.entries(N).map(([s,n])=>{const a=h.filter(x=>x.scope===s),q=a.reduce((z,x)=>z+(+x.total||0),0),ok=a.reduce((z,x)=>z+(+x.score||0),0);return '<div class="card"><b>'+n+'</b><div class="big">'+(q?Math.round(ok/q*100)+'%':'–')+'</div><div class="muted">'+(q?ok+'/'+q+' bonnes réponses':'Aucune donnée')+'</div></div>'}).join('');history.innerHTML=[...h].reverse().map(x=>'<div class="item"><b>'+new Date(x.created_at).toLocaleString('fr-FR')+'</b><div class="muted">'+(N[x.scope]||x.scope)+'</div><div class="big">'+x.score+'/'+x.total+' ('+x.percent+'%)</div></div>').join('')||'<div class="item muted">Aucun test enregistré.</div>'}
load();
</script></body></html>
