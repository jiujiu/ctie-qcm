<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTIE – Progression</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}.btn{padding:10px 14px;border:1px solid #d6dce6;border-radius:10px;background:#fff;cursor:pointer;font-size:16px;line-height:1.2;min-height:42px;display:inline-flex;align-items:center;justify-content:center}.hidden{display:none!important}.primary{background:#111827;color:#fff}.cards,.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.item{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 22px #0001}.big{font-size:28px;font-weight:750}.muted{color:#667085}.cloud{padding:7px 10px;border-radius:9px;background:#eef2ff;font-size:13px;display:inline-block}.history{display:grid;gap:10px}@media(max-width:700px){.wrap{padding:10px}.cards,.subjects{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Ma progression CTIE</h1><div id="cloud" class="cloud">Chargement…</div></div><div class="actions"><button class="btn primary" onclick="location.href='./'">Retour au quiz</button><button class="btn" onclick="load()">Actualiser</button><button class="btn" onclick="exportData()">Exporter</button><label class="btn">Importer<input id="imp" type="file" accept="application/json" class="hidden"></label></div></div><div class="cards"><div class="card"><div class="muted">Tests</div><div id="tests" class="big">0</div></div><div class="card"><div class="muted">Moyenne</div><div id="avg" class="big">–</div></div><div class="card"><div class="muted">Meilleur</div><div id="best" class="big">–</div></div><div class="card"><div class="muted">Erreurs</div><div id="errs" class="big">0</div></div></div><h2>Par matière</h2><div id="subjects" class="subjects"></div><h2>Historique</h2><div id="history" class="history"></div></div>
<script>
const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(U,K),N={MARCHES:'Marchés publics',GDPR:'GDPR / RGPD',LOI_CTIE:'Loi du CTIE',TOGAF:'TOGAF'};
let current=[],currentUser=null;async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');currentUser=user;cloud.textContent='Cloud sécurisé : '+user.email;const [{data:h,error},{count:ec}]=await Promise.all([sb.from('quiz_results').select('*').order('created_at'),sb.from('quiz_errors').select('*',{count:'exact',head:true})]);if(error){cloud.textContent='Accès refusé';return}current=h||[];render(current,ec||0)}
function render(h,errorCount){tests.textContent=h.length;const p=h.map(x=>+x.percent||0);avg.textContent=h.length?Math.round(p.reduce((a,b)=>a+b,0)/h.length)+'%':'–';best.textContent=h.length?Math.max(...p)+'%':'–';errs.textContent=errorCount;subjects.innerHTML=Object.entries(N).map(([s,n])=>{const a=h.filter(x=>x.scope===s),q=a.reduce((z,x)=>z+(+x.total||0),0),ok=a.reduce((z,x)=>z+(+x.score||0),0);return '<div class="card"><b>'+n+'</b><div class="big">'+(q?Math.round(ok/q*100)+'%':'–')+'</div><div class="muted">'+(q?ok+'/'+q+' bonnes réponses':'Aucune donnée')+'</div></div>'}).join('');history.innerHTML=[...h].reverse().map(x=>'<div class="item"><b>'+new Date(x.created_at).toLocaleString('fr-FR')+'</b><div class="muted">'+(N[x.scope]||x.scope)+'</div><div class="big">'+x.score+'/'+x.total+' ('+x.percent+'%)</div></div>').join('')||'<div class="item muted">Aucun test enregistré.</div>'}
function exportData(){const sessions=current.map(x=>({date:x.created_at,mode:x.mode,scope:x.scope,score:x.score,total:x.total,percent:x.percent,breakdown:x.breakdown||'',by:x.by_subject||{}}));const b=new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ctie-progression.json';a.click();URL.revokeObjectURL(a.href)}
function validSession(x){return x&&typeof x==='object'&&(x.date||x.created_at)&&x.mode&&x.scope&&Number.isFinite(Number(x.score))&&Number.isFinite(Number(x.total))&&Number.isFinite(Number(x.percent))}
document.getElementById('imp').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),arr=Array.isArray(raw)?raw:(Array.isArray(raw.sessions)?raw.sessions:[]),clean=arr.filter(validSession);if(!clean.length)throw new Error('Format de progression CTIE non reconnu.');if(!currentUser)await load();const {data:existing,error:re}=await sb.from('quiz_results').select('created_at,mode,scope,score,total');if(re)throw re;const key=x=>[new Date(x.date||x.created_at).toISOString(),String(x.mode),String(x.scope),Number(x.score),Number(x.total)].join('|'),keys=new Set((existing||[]).map(x=>key(x)));const fresh=clean.filter(x=>!keys.has(key(x))).map(x=>({user_id:currentUser.id,created_at:new Date(x.date||x.created_at).toISOString(),mode:String(x.mode),scope:String(x.scope),score:Number(x.score),total:Number(x.total),percent:Number(x.percent),breakdown:String(x.breakdown||''),by_subject:x.by||x.by_subject||{}}));if(fresh.length){const {error}=await sb.from('quiz_results').insert(fresh);if(error)throw error}const {data:oldErrors,error:ee}=await sb.from('quiz_errors').select('session_date,subject,question,selected,correct_answer');if(ee)throw ee;const ekey=x=>[new Date(x.session_date).toISOString(),x.subject,x.question,x.selected??'Sans réponse',x.correct_answer].join('|'),errorKeys=new Set((oldErrors||[]).map(ekey));let ers=[];clean.forEach(s=>(s.errors||[]).forEach(er=>{const answers=Array.isArray(er.answers)?er.answers:[],ci=Number.isInteger(er.correctIndex)?er.correctIndex:(Number.isInteger(er.correct_index)?er.correct_index:answers.indexOf(er.correct??er.correct_answer)),si=Number.isInteger(er.selectedIndex)?er.selectedIndex:(Number.isInteger(er.selected_index)?er.selected_index:answers.indexOf(er.selected));const row={user_id:currentUser.id,session_date:new Date(s.date||s.created_at).toISOString(),subject:String(er.subject||s.scope),concept:String(er.concept||''),question:String(er.question||''),answers,selected_index:si>=0?si:null,selected:er.selected==null?'Sans réponse':String(er.selected),correct_index:ci>=0?ci:0,correct_answer:String(er.correct??er.correct_answer??answers[ci]??''),explanation:String(er.explanation||'')};if(!errorKeys.has(ekey(row))){errorKeys.add(ekey(row));ers.push(row)}}));if(ers.length){const {error}=await sb.from('quiz_errors').insert(ers);if(error)throw error}alert(fresh.length+' résultat(s) et '+ers.length+' erreur(s) importé(s).');await load()}catch(err){alert('Import impossible : '+(err?.message||err))}finally{e.target.value=''}});
load();
</script></body></html>
