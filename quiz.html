<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTIE QCM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(top===self)location.replace('./')</script>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;margin:0;color:#18212f}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001}.hidden{display:none!important}.muted{color:#667085}.small{font-size:13px}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px}button{cursor:pointer}.homegrid button,.controls button{padding:13px;border-radius:11px;border:1px solid #d7dde8;background:#fff;min-height:48px}.homegrid button{min-height:90px}.primary{background:#111827!important;color:#fff;border:none!important}.badge{padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:13px}.top{display:flex;justify-content:space-between;gap:10px}.progress{height:10px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#111827}.answers button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #d7dde8;background:#fff;border-radius:12px}.answers button.correct{background:#eaf8ee;border-color:#4caf67}.answers button.wrong{background:#fdecec;border-color:#d95c5c}.feedback{margin-top:14px;padding:14px;border-radius:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.scorebox{font-size:30px;font-weight:750}@media(max-width:650px){.wrap{padding:8px}.card{padding:14px}.homegrid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><div class="card">
<div id="home"><h1>CTIE – QCM</h1><p class="muted">Choisis une matière. Les banques de questions seront alimentées à partir des documents que tu fourniras.</p><div class="homegrid">
<button onclick="start('MARCHES')"><b>Marchés publics</b><br><span class="small" id="n-MARCHES">Banque en préparation</span></button>
<button onclick="start('GDPR')"><b>GDPR / RGPD</b><br><span class="small" id="n-GDPR">Banque en préparation</span></button>
<button onclick="start('LOI_CTIE')"><b>Loi du CTIE</b><br><span class="small" id="n-LOI_CTIE">Banque en préparation</span></button>
<button onclick="start('TOGAF')"><b>TOGAF</b><br><span class="small" id="n-TOGAF">Banque en préparation</span></button>
</div><p class="muted small">Pas de test mélangé ni de mode examen chronométré pour le moment.</p></div>
<div id="quiz" class="hidden"><div class="top"><span id="subject" class="badge"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><div class="controls"><button id="verify" class="primary" onclick="verify()">Vérifier</button><button id="next" class="hidden" onclick="nextQ()">Question suivante</button><button onclick="goHome()">Quitter</button></div></div>
<div id="result" class="hidden"><h2>Résultat</h2><div id="finalScore" class="scorebox"></div><p id="breakdown"></p><div class="controls"><button class="primary" onclick="goHome()">Retour à l'accueil</button><button onclick="location.href='erreurs.html'">Mes erreurs</button></div></div>
</div></div>
<script>
const SUPABASE_URL='https://ltjpusvagvxvzqtwrnat.supabase.co',SUPABASE_KEY='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SUBJECTS={MARCHES:'Marchés publics',GDPR:'GDPR / RGPD',LOI_CTIE:'Loi du CTIE',TOGAF:'TOGAF'};
let banks={},pool=[],idx=0,selected=null,score=0,errors=[],scope='',currentUser=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');currentUser=user;for(const s of Object.keys(SUBJECTS)){const {data,error}=await sb.from('quiz_questions').select('qid,concept,question,answers,correct,explanation').eq('subject',s).order('qid');banks[s]=error?[]:(data||[]);document.getElementById('n-'+s).textContent=banks[s].length?banks[s].length+' questions':'Banque en préparation'}}
function hide(){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'))}
function start(s){if(!currentUser)return location.replace('./');if(!banks[s]?.length)return alert('La banque '+SUBJECTS[s]+' est encore vide.');scope=s;pool=shuffle(banks[s]).slice(0,20);idx=0;score=0;errors=[];hide();quiz.classList.remove('hidden');render()}
function render(){selected=null;const feedbackEl=document.getElementById('feedback'),verifyEl=document.getElementById('verify'),nextEl=document.getElementById('next'),subjectEl=document.getElementById('subject'),countEl=document.getElementById('count'),barEl=document.getElementById('bar'),questionEl=document.getElementById('question'),answersEl=document.getElementById('answers');feedbackEl.classList.add('hidden');verifyEl.classList.remove('hidden');nextEl.classList.add('hidden');const q=pool[idx];subjectEl.textContent=SUBJECTS[scope];countEl.textContent=(idx+1)+' / '+pool.length;barEl.style.width=((idx+1)/pool.length*100)+'%';questionEl.textContent=q.question;answersEl.innerHTML='';(Array.isArray(q.answers)?q.answers:[]).forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{selected=i;[...answersEl.children].forEach(x=>x.style.outline='');b.style.outline='2px solid #4f46e5'};answersEl.appendChild(b)})}
function verify(){if(selected===null)return alert('Choisis une réponse.');const q=pool[idx],ok=selected===q.correct,answersEl=document.getElementById('answers'),feedbackEl=document.getElementById('feedback'),verifyEl=document.getElementById('verify'),nextEl=document.getElementById('next');[...answersEl.children].forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});feedbackEl.classList.remove('hidden');feedbackEl.innerHTML='<b>'+(ok?'Bonne réponse ✓':'Réponse incorrecte')+'</b><br>'+(q.explanation||'');if(ok)score++;else errors.push({subject:scope,question:q.question,answers:q.answers,selected:q.answers[selected],correct_answer:q.answers[q.correct],selected_index:selected,correct_index:q.correct,explanation:q.explanation||'',concept:q.concept||''});verifyEl.classList.add('hidden');nextEl.classList.remove('hidden')}
function nextQ(){idx++;idx>=pool.length?finish():render()}
async function finish(){hide();result.classList.remove('hidden');const pct=Math.round(score/pool.length*100),date=new Date().toISOString(),session={date,mode:'Entraînement',scope,score,total:pool.length,percent:pct,breakdown:SUBJECTS[scope]+' : '+score+'/'+pool.length,by:{[scope]:[score,pool.length]}};finalScore.textContent=score+'/'+pool.length+' ('+pct+'%)';breakdown.textContent=session.breakdown;const {error:rerr}=await sb.from('quiz_results').insert({created_at:date,user_id:currentUser.id,mode:session.mode,scope,score,total:pool.length,percent:pct,breakdown:session.breakdown,by_subject:session.by});if(errors.length){const rows=errors.map(x=>({...x,user_id:currentUser.id,session_date:date}));await sb.from('quiz_errors').insert(rows)}if(rerr)breakdown.textContent+=' — sauvegarde cloud impossible';else breakdown.textContent+=' — sauvegardé ✓'}
function goHome(){hide();home.classList.remove('hidden')}
load();
</script></body></html>
