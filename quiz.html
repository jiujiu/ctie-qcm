<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CTIE QCM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(top===self)location.replace('./')</script>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;margin:0;color:#18212f}.wrap{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001}.hidden{display:none!important}.muted{color:#667085}.small{font-size:13px}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:18px}button{cursor:pointer}.homegrid button,.controls button{padding:13px;border-radius:11px;border:1px solid #d7dde8;background:#fff;min-height:48px}.homegrid button{min-height:90px}.primary{background:#111827!important;color:#fff;border:none!important}.badge{padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:13px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{padding:8px 11px;border-radius:10px;background:#f3f4f6;font-variant-numeric:tabular-nums;margin-top:12px;display:inline-block}.timer strong{font-size:18px}.progress{height:10px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#111827}.answers button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #d7dde8;background:#fff;border-radius:12px}.answers button.selected{background:#eef2ff;border-color:#4f46e5}.answers button.correct{background:#eaf8ee;border-color:#4caf67}.answers button.wrong{background:#fdecec;border-color:#d95c5c}.feedback{margin-top:14px;padding:14px;border-radius:12px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.scorebox{font-size:30px;font-weight:750}.error-card{border:1px solid #d7dde8;border-radius:14px;padding:16px;margin:14px 0}.bad{color:#991b1b}.good{color:#166534}.explanation{background:#f8fafc;padding:10px;border-radius:9px;margin-top:8px}@media(max-width:650px){.wrap{padding:8px}.card{padding:14px}.homegrid{grid-template-columns:1fr 1fr}.top{font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;position:sticky;bottom:0;background:#fff;padding:8px 0}.controls button{width:100%;font-size:13px}}</style></head>
<body><div class="wrap"><div class="card">
<div id="home"><h1>CTIE – QCM</h1><p class="muted">Choisis une matière. Chaque test contient 20 questions aléatoires.</p><div class="homegrid">
<button onclick="start('MARCHES')"><b>Marchés publics</b><br><span class="small" id="n-MARCHES">Chargement…</span></button>
<button onclick="start('GDPR')"><b>GDPR / RGPD</b><br><span class="small" id="n-GDPR">Chargement…</span></button>
<button onclick="start('LOI_CTIE')"><b>Loi du CTIE</b><br><span class="small" id="n-LOI_CTIE">Chargement…</span></button>
<button onclick="start('TOGAF')"><b>TOGAF</b><br><span class="small" id="n-TOGAF">Chargement…</span></button></div></div>
<div id="quiz" class="hidden"><div class="top"><span id="subject" class="badge"></span><span id="count"></span></div><div class="timer">Temps matière : <strong id="subjectTimer">00:00</strong></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><div class="controls"><button id="prev" class="hidden" onclick="prevQ()">Précédent</button><button id="verify" class="primary" onclick="verify()">Vérifier</button><button id="next" class="hidden" onclick="nextQ()">Question suivante</button><button onclick="goHome()">Quitter</button></div></div>
<div id="result" class="hidden"><h2>Résultat</h2><div id="finalScore" class="scorebox"></div><p id="breakdown"></p><div class="controls"><button class="primary" onclick="goHome()">Retour à l'accueil</button><button id="reviewBtn" onclick="reviewErrors()">Revoir mes erreurs</button><button onclick="location.href='erreurs.html'">Toutes mes erreurs</button></div></div>
<div id="review" class="hidden"><div class="top"><h2>Erreurs de ce test</h2><span id="reviewCount" class="badge"></span></div><div id="reviewList"></div><div class="controls"><button onclick="backResult()">Retour au résultat</button><button class="primary" onclick="goHome()">Accueil</button></div></div>
</div></div><script>
const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(U,K),SUBJECTS={MARCHES:'Marchés publics',GDPR:'GDPR / RGPD',LOI_CTIE:'Loi du CTIE',TOGAF:'TOGAF'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let banks={},pool=[],idx=0,score=0,errors=[],scope='',currentUser=null,states=[],startedAt=0,timerId=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hide(){['home','quiz','result','review'].forEach(x=>$(x).classList.add('hidden'))}
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');currentUser=user;for(const s of Object.keys(SUBJECTS)){const {data,error}=await sb.from('quiz_questions').select('qid,concept,question,answers,correct,explanation').eq('subject',s).order('qid');banks[s]=error?[]:(data||[]);$('n-'+s).textContent=banks[s].length?banks[s].length+' questions':'Banque en préparation'}}
function start(s){if(!currentUser)return location.replace('./');if(!banks[s]?.length)return alert('Banque vide.');scope=s;pool=shuffle(banks[s]).slice(0,20);states=pool.map(()=>({selected:null,verified:false,ok:false}));idx=0;score=0;errors=[];startedAt=Date.now();clearInterval(timerId);timerId=setInterval(tick,1000);hide();$('quiz').classList.remove('hidden');tick();render()}
function tick(){const n=Math.floor((Date.now()-startedAt)/1000),m=Math.floor(n/60),s=n%60;$('subjectTimer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){const q=pool[idx],st=states[idx];$('subject').textContent=SUBJECTS[scope];$('count').textContent=(idx+1)+' / '+pool.length;$('bar').style.width=((idx+1)/pool.length*100)+'%';$('question').textContent=q.question;$('answers').innerHTML='';$('feedback').classList.toggle('hidden',!st.verified);$('feedback').innerHTML=st.verified?'<b>'+(st.ok?'Bonne réponse ✓':'Réponse incorrecte')+'</b><br>'+esc(q.explanation||''):'';(q.answers||[]).forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.classList.toggle('selected',st.selected===i&&!st.verified);if(st.verified){b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===st.selected)b.classList.add('wrong')}b.onclick=()=>choose(i);$('answers').appendChild(b)});$('prev').classList.toggle('hidden',idx===0);$('verify').classList.toggle('hidden',st.verified);$('next').classList.toggle('hidden',!st.verified)}
function choose(i){const st=states[idx];if(st.verified)return;st.selected=i;render()}
function verify(){const q=pool[idx],st=states[idx];if(st.selected===null)return alert('Choisis une réponse.');st.verified=true;st.ok=st.selected===q.correct;if(st.ok)score++;else errors.push({subject:scope,question:q.question,answers:q.answers,selected:q.answers[st.selected],correct_answer:q.answers[q.correct],selected_index:st.selected,correct_index:q.correct,explanation:q.explanation||'',concept:q.concept||''});render()}
function prevQ(){if(idx>0){idx--;render()}}
function nextQ(){idx++;idx>=pool.length?finish():render()}
async function finish(){clearInterval(timerId);hide();$('result').classList.remove('hidden');const pct=Math.round(score/pool.length*100),date=new Date().toISOString(),session={date,mode:'Entraînement',scope,score,total:pool.length,percent:pct,breakdown:SUBJECTS[scope]+' : '+score+'/'+pool.length,by:{[scope]:[score,pool.length]}};$('finalScore').textContent=score+'/'+pool.length+' ('+pct+'%)';$('breakdown').textContent=session.breakdown;$('reviewBtn').classList.toggle('hidden',!errors.length);const {error:rerr}=await sb.from('quiz_results').insert({created_at:date,user_id:currentUser.id,mode:session.mode,scope,score,total:pool.length,percent:pct,breakdown:session.breakdown,by_subject:session.by});if(errors.length){const rows=errors.map(x=>({...x,user_id:currentUser.id,session_date:date}));const {error:eerr}=await sb.from('quiz_errors').insert(rows);if(eerr)$('breakdown').textContent+=' — erreurs non sauvegardées'}if(rerr)$('breakdown').textContent+=' — sauvegarde cloud impossible';else $('breakdown').textContent+=' — sauvegardé ✓'}
function reviewErrors(){hide();$('review').classList.remove('hidden');$('reviewCount').textContent=errors.length+' erreur(s)';$('reviewList').innerHTML=errors.length?errors.map(e=>'<article class="error-card"><h3>'+esc(e.question)+'</h3><div class="bad"><b>Ta réponse :</b> '+esc(e.selected)+'</div><div class="good"><b>Bonne réponse :</b> '+esc(e.correct_answer)+'</div><div class="explanation"><b>Explication :</b> '+esc(e.explanation)+'</div></article>').join(''):'<p class="muted">Aucune erreur.</p>'}
function backResult(){hide();$('result').classList.remove('hidden')}
function goHome(){clearInterval(timerId);hide();$('home').classList.remove('hidden')}
load();
</script></body></html>
